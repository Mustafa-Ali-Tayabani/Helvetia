document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ght:400;max-width:480px;margin:28px 0 0;color:rgba(244,239,230,.8);text-wrap:pretty\">Selected guidance for parents considering Switzerland. For advice specific to your child, request a private consultation.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <a href=\"#ch1\" style=\"border:1px solid rgba(244,239,230,.3);color:#F4EFE6;padding:10px 18px;border-radius:999px;font-size:13px\" style-hover=\"border-color:#B89B6A;color:#D9C49C\">01 Boarding schools<\u002Fa>\n      <a href=\"#ch2\" style=\"border:1px solid rgba(244,239,230,.3);color:#F4EFE6;padding:10px 18px;border-radius:999px;font-size:13px\" style-hover=\"border-color:#B89B6A;color:#D9C49C\">02 Universities<\u002Fa>\n      <a href=\"#ch3\" style=\"border:1px solid rgba(244,239,230,.3);color:#F4EFE6;padding:10px 18px;border-radius:999px;font-size:13px\" style-hover=\"border-color:#B89B6A;color:#D9C49C\">03 Planning<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"min-height:520px;position:relative\">\n    <img src=\"https://helvetia-edu.com/assets/img/photo-insight-1.jpg\" alt=\"Swiss Alps landscape\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<main>\n\n<article id=\"ch1\" style=\"scroll-margin-top:90px;padding:clamp(72px,10vw,140px) clamp(20px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(32px,5vw,80px);max-width:1360px;margin:0 auto;box-sizing:border-box\">\n  <aside style=\"grid-column:span 1\">\n    <div style=\"position:sticky;top:120px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(88px,10vw,150px);line-height:.8;color:#B89B6A\">01<\u002Fspan>\n      <span style=\"font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#6A7488\">Boarding schools<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Faside>\n  <div style=\"grid-column:span 2;max-width:720px;min-width:0\">\n    <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,4.6vw,68px);line-height:1;letter-spacing:-.015em;margin:0 0 40px;text-wrap:balance\">Why Swiss boarding schools remain the world's reference<\u002Fh2>\n    <p style=\"font-size:clamp(18px,1.5vw,21px);line-height:1.65;margin:0 0 24px;text-wrap:pretty\"><span style=\"float:left;font-family:'Instrument Serif',serif;font-size:92px;line-height:.78;padding:8px 12px 0 0;color:#0B1D3A\">S<\u002Fspan>witzerland has educated the children of international families for more than a century. The reasons have changed remarkably little: political stability, personal safety, small classes, genuinely multilingual campuses and an academic culture that combines rigour with breadth: sport, the arts, outdoor education and character.<\u002Fp>\n    <p style=\"font-size:17px;line-height:1.75;margin:0 0 32px;color:#2C3B55;text-wrap:pretty\">The leading schools offer several curricula side by side (the International Baccalaureate, British A-Levels, the French Baccalauréat, the Swiss Maturité and American High School Diploma pathways), which allows a family to keep options open for universities in Europe, the United Kingdom and the United States.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:0 0 48px\">\n      <span style=\"border:1px solid rgba(11,29,58,.2);padding:8px 14px;border-radius:999px;font-size:13px\">International Baccalaureate<\u002Fspan>\n      <span style=\"border:1px solid rgba(11,29,58,.2);padding:8px 14px;border-radius:999px;font-size:13px\">British A-Levels<\u002Fspan>\n      <span style=\"border:1px solid rgba(11,29,58,.2);padding:8px 14px;border-radius:999px;font-size:13px\">French Baccalauréat<\u002Fspan>\n      <span style=\"border:1px solid rgba(11,29,58,.2);padding:8px 14px;border-radius:999px;font-size:13px\">Swiss Maturité<\u002Fspan>\n      <span style=\"border:1px solid rgba(11,29,58,.2);padding:8px 14px;border-radius:999px;font-size:13px\">American High School Diploma<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:17px;line-height:1.75;margin:0 0 48px;color:#2C3B55;text-wrap:pretty\">Places at the most sought-after schools are limited and the admissions process is personal: school visits, interviews with the family, assessments and references matter as much as grades.<\u002Fp>\n    <blockquote style=\"margin:0;padding:36px 0;border-top:1px solid #B89B6A;border-bottom:1px solid #B89B6A;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(28px,3vw,42px);line-height:1.15;text-wrap:balance\">A well-prepared, well-timed application, presented to the right schools, makes a decisive difference.<\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Farticle>\n\n<figure style=\"margin:0;position:relative;height:clamp(360px,62vw,760px);overflow:hidden;background:#0B1D3A\">\n  <img data-fx-parallax=\"0.18\" data-fx-scale=\"1.2\" src=\"https://helvetia-edu.com/assets/img/photo-insight-2.jpg\" alt=\"University of Geneva, Uni Bastions building\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n  <figcaption style=\"position:absolute;left:clamp(20px,4vw,56px);bottom:24px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#F4EFE6;background:rgba(11,29,58,.7);padding:8px 12px\">University of Geneva · Uni Bastions<\u002Ffigcaption>\n<\u002Ffigure>\n\n<article id=\"ch2\" style=\"scroll-margin-top:90px;background:#0B1D3A;color:#F4EFE6;padding:clamp(72px,10vw,140px) clamp(20px,4vw,56px)\">\n  <div style=\"max-width:1360px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(32px,5vw,80px)\">\n    <aside>\n      <div style=\"position:sticky;top:120px;display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(88px,10vw,150px);line-height:.8;color:#B89B6A\">02<\u002Fspan>\n        <span style=\"font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,239,230,.6)\">Universities<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Faside>\n    <div style=\"grid-column:span 2;max-width:760px;min-width:0\">\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,4.6vw,68px);line-height:1;letter-spacing:-.015em;margin:0 0 40px;text-wrap:balance\">University pathways from <em style=\"color:#D9C49C\">Switzerland<\u002Fem><\u002Fh2>\n      <p style=\"font-size:clamp(18px,1.5vw,21px);line-height:1.65;margin:0 0 28px;color:rgba(244,239,230,.92);text-wrap:pretty\">A Swiss school record is a strong foundation. ETH Zurich and EPFL rank among the world's finest technical universities; the Universities of Geneva, Lausanne, Zurich, St. Gallen and Basel are internationally respected; and Switzerland is home to the leading hospitality and business schools.<\u002Fp>\n      <p style=\"font-size:17px;line-height:1.75;margin:0 0 56px;color:rgba(244,239,230,.75);text-wrap:pretty\">Many Helvetia families also look beyond Switzerland: to Oxford, Cambridge and the Russell Group in the United Kingdom, to the Ivy League and liberal-arts colleges in the United States, and to postgraduate and MBA programmes worldwide. The key is an educational strategy that starts early, chooses the right curriculum, and builds a profile that admissions committees recognise.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border-top:1px solid rgba(184,155,106,.4)\">\n        <div style=\"padding:24px 24px 24px 0;border-bottom:1px solid rgba(184,155,106,.4);display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A\">Switzerland<\u002Fspan>\n          <span style=\"font-family:'Instrument Serif',serif;font-size:22px;line-height:1.25\">ETH Zurich, EPFL, Geneva, Lausanne, Zurich, St. Gallen, Basel<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:24px 24px 24px 0;border-bottom:1px solid rgba(184,155,106,.4);display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A\">United Kingdom<\u002Fspan>\n          <span style=\"font-family:'Instrument Serif',serif;font-size:22px;line-height:1.25\">Oxford, Cambridge, the Russell Group<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:24px 24px 24px 0;border-bottom:1px solid rgba(184,155,106,.4);display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A\">United States<\u002Fspan>\n          <span style=\"font-family:'Instrument Serif',serif;font-size:22px;line-height:1.25\">Ivy League, liberal-arts colleges<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Farticle>\n\n<article id=\"ch3\" style=\"scroll-margin-top:90px;position:relative;overflow:hidden;color:#F4EFE6;background:#0B1D3A\">\n  <img src=\"https://helvetia-edu.com/assets/img/photo-lavaux.jpg\" alt=\"Lavaux vineyards above Lake Geneva\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n  <div style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,20,42,.94) 0%,rgba(7,20,42,.82) 55%,rgba(7,20,42,.6) 100%)\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1360px;margin:0 auto;padding:clamp(72px,10vw,140px) clamp(20px,4vw,56px);box-sizing:border-box\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:56px\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#D9C49C\"><span style=\"font-family:'Instrument Serif',serif;font-size:22px;letter-spacing:0;margin-right:12px\">03<\u002Fspan>Planning<\u002Fspan>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,5vw,76px);line-height:1;letter-spacing:-.015em;margin:0;max-width:720px;text-wrap:balance\">The admissions timeline: <em style=\"color:#D9C49C\">when to start<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <sc-if value=\"{{ tabsMode }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;padding:4px;border:1px solid rgba(244,239,230,.3);border-radius:999px;background:rgba(7,20,42,.5)\">\n        <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ tab.onClick }}\" style=\"border:0;cursor:pointer;font-family:inherit;font-size:14px;letter-spacing:.04em;padding:12px 22px;border-radius:999px;background:{{ tab.bg }};color:{{ tab.fg }};transition:background .3s,color .3s\">{{ tab.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ tabsMode }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:relative\">\n      <div style=\"position:absolute;left:0;right:0;top:9px;height:1px;background:rgba(184,155,106,.5)\"><\u002Fdiv>\n      <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:32px\">\n        <sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <li style=\"position:relative;display:flex;flex-direction:column;gap:16px;padding-top:40px\">\n            <span style=\"position:absolute;top:0;left:0;width:19px;height:19px;border-radius:50%;background:#0B1D3A;border:1px solid #B89B6A;box-sizing:border-box;display:flex;align-items:center;justify-content:center\"><span style=\"width:7px;height:7px;border-radius:50%;background:#D9C49C\"><\u002Fspan><\u002Fspan>\n            <span style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A\">Months before entry<\u002Fspan>\n            <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(48px,5vw,72px);line-height:.9\">{{ s.range }}<\u002Fspan>\n            <span style=\"font-size:17px;line-height:1.55;color:rgba(244,239,230,.88);text-wrap:pretty;min-height:80px\">{{ s.text }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tableMode }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"overflow-x:auto\">\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:640px;font-size:16px;line-height:1.5\">\n        <sc-raw-thead><sc-raw-tr>\n          <sc-raw-th style=\"text-align:left;font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A;padding:0 24px 18px 0;border-bottom:1px solid rgba(184,155,106,.5)\">Months before entry<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A;padding:0 24px 18px 0;border-bottom:1px solid rgba(184,155,106,.5)\">Boarding school<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A;padding:0 0 18px 0;border-bottom:1px solid rgba(184,155,106,.5)\">University<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"font-family:'Instrument Serif',serif;font-size:40px;padding:24px 24px 24px 0;border-bottom:1px solid rgba(244,239,230,.15);white-space:nowrap;vertical-align:top\">{{ r.range }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:28px 24px 24px 0;border-bottom:1px solid rgba(244,239,230,.15);color:rgba(244,239,230,.88);vertical-align:top\">{{ r.school }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:28px 0 24px 0;border-bottom:1px solid rgba(244,239,230,.15);color:rgba(244,239,230,.88);vertical-align:top\">{{ r.uni }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top:72px;display:flex;flex-wrap:wrap;gap:32px;align-items:center;justify-content:space-between;border-top:1px solid rgba(244,239,230,.2);padding-top:40px\">\n      <p style=\"margin:0;max-width:560px;font-size:17px;line-height:1.65;color:rgba(244,239,230,.82);text-wrap:pretty\">Mid-year entries, transfers and urgent situations are common and can be handled, but the earlier a family starts, the more options remain open.<\u002Fp>\n      <a href=\"Helvetia Home.html#contact\" style=\"display:flex;align-items:center;gap:14px;background:#B89B6A;color:#0B1D3A;padding:18px 28px;border-radius:999px;font-size:15px;font-weight:500;letter-spacing:.03em\" style-hover=\"background:#F4EFE6;color:#0B1D3A\">Discuss your family's timeline <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fmain>\n\n<footer style=\"background:#07142A;color:rgba(244,239,230,.7);padding:clamp(64px,8vw,110px) clamp(20px,4vw,56px) 32px\">\n  <div style=\"max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:64px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:40px\">\n      <div style=\"grid-column:span 2;display:flex;flex-direction:column;gap:24px;max-width:420px;min-width:0\">\n        <img src=\"https://helvetia-edu.com/assets/img/logo-light.svg\" alt=\"Helvetia Education Group. Tradition, Trust, Excellence\" style=\"height:64px;width:auto;align-self:flex-start\">\n        <p style=\"font-family:'Instrument Serif',serif;font-size:26px;line-height:1.2;color:#F4EFE6;margin:0\">Confidence for parents. Care for every journey. Excellence in every detail.<\u002Fp>\n        <p style=\"font-size:13px;line-height:1.6;margin:0\">Independent education adviser. Helvetia does not provide regulated financial, insurance or legal services and does not guarantee admission to any institution.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;font-size:14px\">\n        <h4 style=\"margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A\">Divisions<\u002Fh4>\n        <a href=\"Helvetia Home.html#admissions\" style=\"color:rgba(244,239,230,.92)\" style-hover=\"color:#D9C49C\">Helvetia Admissions<\u002Fa>\n        <a href=\"Helvetia Home.html#prive\" style=\"color:rgba(244,239,230,.92)\" style-hover=\"color:#D9C49C\">Helvetia Privé<\u002Fa>\n        <a href=\"Helvetia Home.html#elite\" style=\"color:rgba(244,239,230,.92)\" style-hover=\"color:#D9C49C\">Helvetia Elite<\u002Fa>\n        <a href=\"Helvetia Home.html#pricing\" style=\"color:rgba(244,239,230,.92)\" style-hover=\"color:#D9C49C\">Fees &amp; Pricing<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;font-size:14px\">\n        <h4 style=\"margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#B89B6A\">Company<\u002Fh4>\n        <a href=\"Helvetia About.html\" style=\"color:rgba(244,239,230,.92)\" style-hover=\"color:#D9C49C\">About Helvetia Education Group<\u002Fa>\n        <a href=\"Helvetia Insights.html\" style=\"color:rgba(244,239,230,.92)\" style-hover=\"color:#D9C49C\">Swiss Education Insights<\u002Fa>\n        <a href=\"Helvetia Home.html#contact\" style=\"color:rgba(244,239,230,.92)\" style-hover=\"color:#D9C49C\">Private Consultation<\u002Fa>\n        <a href=\"Helvetia Pay.html\" style=\"color:rgba(244,239,230,.92)\" style-hover=\"color:#D9C49C\">Pay an Invoice<\u002Fa>\n      <\u002Fd
